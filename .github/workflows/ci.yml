name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install --requirement requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  docker:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: status-board:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the container and check it answers
        run: |
          docker run --detach --name status-board \
            --publish 8000:8000 \
            --env SERVICES="Example=https://example.com" \
            status-board:ci

          for _ in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/healthz > /dev/null; then
              break
            fi
            sleep 1
          done

          echo "--- /healthz ---"
          curl --fail --silent --show-error http://localhost:8000/healthz | grep '"ok"'

          echo "--- /api/status ---"
          curl --silent --show-error http://localhost:8000/api/status

          echo "--- / ---"
          curl --fail --silent --show-error http://localhost:8000/ > /dev/null

          echo "--- container runs as a non-root user ---"
          test "$(docker exec status-board id --user --name)" = "appuser"

      - name: Container logs
        if: always()
        run: docker logs status-board || true

      - name: Stop the container
        if: always()
        run: docker rm --force status-board || true

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
