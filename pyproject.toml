[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Make `app` importable from the project root, so a bare `pytest` works the
# same as `python -m pytest` (which silently adds the current directory).
pythonpath = ["."]
